<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panda & Bear Love</title>
<style>
body{background:#FFF8F0;font-family:sans-serif;text-align:center;padding:20px;margin:0}
.card{background:#fff;max-width:400px;margin:auto;border-radius:28px;padding:22px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
img{width:100%;border-radius:20px}
h1{color:#FF8C42;margin:12px 0 5px 0}
button{background:#FF8C42;color:#fff;border:none;padding:15px 40px;border-radius:50px;font-size:18px;font-weight:bold;margin:18px 0;cursor:pointer;box-shadow:0 5px 15px rgba(255,140,66,.4)}
#surprise{display:none;background:linear-gradient(135deg,#FFF2E8,#FFE0CC);border-radius:20px;padding:22px;margin-top:18px;border:2px dashed #FF8C42}
</style>
</head>
<body>
<div class="card">
<img src="panda.jpg" alt="Panda Bear">
<h1>🐼 Panda & Bear 🧸</h1>
<p style="color:#999;">My favorite love story</p>

<button onclick="document.getElementById('surprise').style.display='block'">🧡 Click Me</button>

<div id="surprise">
<p style="font-size:22px;color:#C0562B;line-height:1.6;margin:0;">
<b>You are my favorite person ever! 🥺💖</b><br>
My Panda, My Bear, My Everything!<br><br>
🐼💕🧸
</p>
</div>

</div>
</body>
</html>
